<!doctype html>
<!-- Admin dashboard, served at admin/: the API is one level up (data-api, see common.js). -->
<html lang="en" data-api="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawler admin</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="layout">
  <section id="admin" aria-label="Crawler admin">
    <div class="bar">
      <h1>Crawler</h1>
      <span class="pill" id="state">…</span>
      <span class="spacer"></span>
      <button class="btn primary" id="start">Start</button>
      <button class="btn" id="once" title="Run a single cycle">Run once</button>
      <button class="btn" id="stop">Stop</button>
    </div>
    <div class="bar" style="margin-top:10px">
      <div class="workers" id="workers"><span>Parallel pages</span></div>
    </div>
    <div class="phase" id="phase"></div>
    <div class="progress" id="progress"></div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="queue">Queue</button>
      <button role="tab" data-tab="templates">Templates</button>
      <button role="tab" data-tab="sources">Sources</button>
      <button role="tab" data-tab="domains">Domains</button>
      <button role="tab" data-tab="ai">AI</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <div id="tab"></div>
  </section>
  <section id="events" aria-label="Events">
    <div class="titlebar">
      <h2 class="title">What's on in Slovakia</h2>
      <div class="chips views" id="views" role="group" aria-label="View">
        <button data-view="list" aria-pressed="true">List</button>
        <button data-view="map">Map</button>
      </div>
    </div>
    <p class="sub" id="summary">Loading…</p>
    <div class="controls">
      <input type="search" id="q" placeholder="Search events, places…" aria-label="Search">
      <select id="city" aria-label="Town"><option value="">All towns</option></select>
      <div class="chips" id="ranges">
        <button data-range="today">Today</button>
        <button data-range="weekend">Weekend</button>
        <button data-range="week" aria-pressed="true">7 days</button>
        <button data-range="all">All</button>
      </div>
    </div>
    <div class="tagfilter" id="tags" aria-label="Filter by kind of event"></div>
    <div id="mapview" hidden>
      <div class="mapbar"><span class="muted" id="mapnote"></span><button class="btn" id="fit">Zoom to events</button></div>
      <div id="map" role="region" aria-label="Map of events"></div>
    </div>
    <div id="list"></div>
    <footer id="footer"></footer>
  </section>
</div>
<script src="../common.js"></script>
<script src="../events.js"></script>
<script src="../admin.js"></script>
</body>
</html>
