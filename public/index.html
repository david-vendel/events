<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Košice Events</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #efede8; --card: #fff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
    --accent: #b3261e; --chip: #e6e4de; --new: #1f7a4d;
    --ok: #17663f; --ok-bg: #dcf3e6; --bad: #a3221b; --bad-bg: #fbe0de; --warn: #8a5a00; --warn-bg: #fdf0d2;
    --info: #1d4f91; --info-bg: #dfeafb; --bar: #1d1d1f; --ai: #6a3fb5; --ai-bg: #ece4fa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --panel: #19191c; --card: #1f1f23; --text: #ececee; --muted: #9a9aa0; --line: #2e2e33;
      --accent: #ff6b5e; --chip: #2a2a2e; --new: #4cc38a;
      --ok: #6fdca2; --ok-bg: #173826; --bad: #ff8a80; --bad-bg: #44201e; --warn: #f3c262; --warn-bg: #3d2f12;
      --info: #8db8ff; --info-bg: #1b2a44; --bar: #ececee; --ai: #c3a6ff; --ai-bg: #2e2347; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100vh; }
  .layout > section { overflow-y: auto; padding: 20px 20px 64px; }
  #admin { background: var(--panel); border-right: 1px solid var(--line); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); height: auto; }
    .layout > section { overflow: visible; padding: 16px 16px 48px; }
    #admin { border-right: 0; border-bottom: 1px solid var(--line); }
  }

  /* ------------------------------------------------ admin */
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .bar h1 { font-size: 20px; margin: 0 8px 0 0; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase;
    letter-spacing: .04em; background: var(--chip); color: var(--muted); }
  .pill.running { background: var(--ok-bg); color: var(--ok); }
  .pill.waiting { background: var(--info-bg); color: var(--info); }
  .pill.stopping { background: var(--warn-bg); color: var(--warn); }
  .btn { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 8px; }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn:disabled { opacity: .45; cursor: default; }
  .spacer { flex: 1; }
  .workers { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
  .workers span { margin-right: 4px; }
  .workers button { border: 1px solid var(--line); background: var(--card); min-width: 34px; padding: 4px 6px; border-radius: 6px; }
  .workers button[aria-pressed=true] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .phase { margin: 12px 0 4px; font-size: 14px; }
  .phase b { font-weight: 600; }
  .muted { color: var(--muted); }
  .progress { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 8px 0 14px; }
  .progress .label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .track { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .track > div { height: 100%; background: var(--bar); width: 0; transition: width .4s; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 6px 0 14px; overflow-x: auto; }
  .tabs button { border: 0; background: none; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent;
    white-space: nowrap; }
  .tabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; }
  .tile .n { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 12px; color: var(--muted); }
  button.tile:hover { border-color: var(--muted); }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  .scroll { overflow-x: auto; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; }
  .grid th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line);
    white-space: nowrap; }
  .grid td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .grid tr:last-child td { border-bottom: 0; }
  .grid .url { overflow-wrap: anywhere; min-width: 160px; }
  .grid .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .grid tr.click { cursor: pointer; }
  .grid tr.click:hover td, .grid tr.sel td { background: var(--chip); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--chip);
    color: var(--muted); white-space: nowrap; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.info { background: var(--info-bg); color: var(--info); }
  .empty-row { color: var(--muted); padding: 12px 8px; font-size: 13px; }
  .log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; max-height: 220px; overflow-y: auto;
    overflow-wrap: anywhere; }
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; }
  .detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0 0 10px; font-size: 13px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; overflow-wrap: anywhere; }
  pre { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel); border-radius: 8px;
    padding: 10px; overflow: auto; max-height: 420px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .form { display: grid; grid-template-columns: max-content 110px; gap: 10px 14px; align-items: center; font-size: 14px; }
  .form input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); font: inherit; }
  .note { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 12px; font-size: 12.5px; }
  .steps span { padding: 4px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .steps span.done { color: var(--text); }
  .steps span.now { background: var(--text); color: var(--bg); font-weight: 600; }
  .steps i { font-style: normal; color: var(--muted); align-self: center; }
  .aibox { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; font-size: 13.5px; }
  .aibox .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .aibox.busy .dot { background: var(--ai); animation: pulse 1.2s ease-in-out infinite; }
  .aibox .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  @keyframes pulse { 50% { opacity: .3; } }
  .tag.ai { background: var(--ai-bg); color: var(--ai); cursor: pointer; }

  /* ------------------------------------------------ events */
  #events h2.title { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  input[type=search] { flex: 1 1 200px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--text); font: inherit; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border: 0; background: var(--chip); padding: 8px 12px; border-radius: 999px; }
  .chips button[aria-pressed=true] { background: var(--text); color: var(--bg); }
  h4.day { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; }
  .event { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    margin-bottom: 8px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
  .event .time { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); }
  .event .name { font-weight: 600; text-decoration: none; }
  .event .name:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .desc { font-size: 14px; margin-top: 4px; }
  .badge { font-size: 11px; font-weight: 700; color: var(--new); margin-left: 6px; text-transform: uppercase; }
  .sources { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12.5px; }
  .sources th { text-align: left; font-weight: 500; color: var(--muted); padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); }
  .sources td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .sources tr:last-child td { border-bottom: 0; }
  .sources .role { color: var(--muted); }
  .d { white-space: nowrap; padding: 1px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .d.ok { background: var(--ok-bg); color: var(--ok); }
  .d.bad { background: var(--bad-bg); color: var(--bad); }
  .d.na { color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { color: var(--muted); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
<div class="layout">
  <section id="admin" aria-label="Crawler admin">
    <div class="bar">
      <h1>Crawler</h1>
      <span class="pill" id="state">…</span>
      <span class="spacer"></span>
      <button class="btn primary" id="start">Start</button>
      <button class="btn" id="once" title="Run a single cycle">Run once</button>
      <button class="btn" id="stop">Stop</button>
    </div>
    <div class="bar" style="margin-top:10px">
      <div class="workers" id="workers"><span>Parallel pages</span></div>
    </div>
    <div class="phase" id="phase"></div>
    <div class="progress" id="progress"></div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button role="tab" data-tab="queue">Queue</button>
      <button role="tab" data-tab="sources">Sources</button>
      <button role="tab" data-tab="ai">AI usage</button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <div id="tab"></div>
  </section>

  <section id="events" aria-label="Events">
    <h2 class="title">What's on in Košice</h2>
    <p class="sub" id="summary">Loading…</p>
    <div class="controls">
      <input type="search" id="q" placeholder="Search events, places…" aria-label="Search">
      <div class="chips" id="ranges">
        <button data-range="today">Today</button>
        <button data-range="weekend">Weekend</button>
        <button data-range="week" aria-pressed="true">7 days</button>
        <button data-range="all">All</button>
      </div>
    </div>
    <div id="list"></div>
    <footer id="footer"></footer>
  </section>
</div>
<script src="common.js"></script>
<script src="events.js"></script>
<script src="admin.js"></script>
</body>
</html>
