<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slovakia Events</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout single">
  <section id="events" aria-label="Events">
    <div class="titlebar">
      <h2 class="title">What's on in Slovakia</h2>
      <div class="chips views" id="views" role="group" aria-label="View">
        <button data-view="list" aria-pressed="true">List</button>
        <button data-view="map">Map</button>
      </div>
    </div>
    <p class="sub" id="summary">Loading…</p>
    <div class="controls">
      <input type="search" id="q" placeholder="Search events, places…" aria-label="Search">
      <select id="city" aria-label="Town"><option value="">All towns</option></select>
      <div class="chips" id="ranges">
        <button data-range="today">Today</button>
        <button data-range="weekend">Weekend</button>
        <button data-range="week" aria-pressed="true">7 days</button>
        <button data-range="all">All</button>
      </div>
    </div>
    <div class="tagfilter" id="tags" aria-label="Filter by kind of event"></div>
    <div id="mapview" hidden>
      <div class="mapbar"><span class="muted" id="mapnote"></span><button class="btn" id="fit">Zoom to events</button></div>
      <div id="map" role="region" aria-label="Map of events"></div>
    </div>
    <div id="list"></div>
    <footer id="footer"></footer>
  </section>
</div>
<script src="common.js"></script>
<script src="events.js"></script>
</body>
</html>
